<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6757e8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon.svg">
<title>AulaTime</title>
<style>
:root{--accent:#6757e8;--bg:#f7f7fb;--card:#fff;--text:#17172a;--muted:#77788c;--line:#e8e8f0;--shadow:0 12px 35px #25234d12}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}button{border:0;cursor:pointer}.app{max-width:1100px;margin:auto;padding:18px 18px 100px}
header{display:flex;justify-content:space-between;align-items:center;margin:4px 0 18px}.brand{display:flex;gap:11px;align-items:center}.logo{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#8377ff,var(--accent));display:grid;place-items:center;color:white;font-size:21px;box-shadow:0 8px 20px #6757e833}.brand h1{font-size:21px;margin:0}.brand small{color:var(--muted)}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--card);box-shadow:var(--shadow);color:var(--text)}
.hero{background:linear-gradient(135deg,#6d5bea,#8176ff);color:#fff;border-radius:26px;padding:22px;box-shadow:0 16px 40px #6757e83a;margin-bottom:18px}
.hero .eyebrow{opacity:.8;font-size:13px}.hero h2{font-size:30px;line-height:1.08;margin:5px 0 10px}.hero p{margin:0;opacity:.88}.next{margin-top:18px;background:#ffffff18;border:1px solid #ffffff26;border-radius:18px;padding:15px;display:flex;justify-content:space-between;align-items:center}.next strong{display:block;font-size:18px}.next span{font-size:13px;opacity:.82}
.tabs{display:flex;background:var(--card);padding:4px;border-radius:16px;box-shadow:var(--shadow);margin-bottom:18px}.tabs button{flex:1;padding:11px;border-radius:12px;background:transparent;color:var(--muted);font-weight:700}.tabs button.active{background:#eeeaff;color:var(--accent)}
.panel{display:none}.panel.active{display:block}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin:16px 2px 10px}.sectionhead h3{margin:0;font-size:18px}.primary{background:var(--accent);color:#fff;border-radius:13px;padding:10px 14px;font-weight:750}
.week{display:grid;grid-template-columns:58px repeat(5,1fr);gap:7px;overflow:auto;padding-bottom:6px}.dayhead{text-align:center;color:var(--muted);font-size:12px;font-weight:700;padding:8px}.dayhead.today{color:var(--accent)}.time{height:64px;color:#9a9bad;font-size:11px;padding-top:3px}.col{min-width:120px;position:relative}.slot{height:64px;border-top:1px solid var(--line)}.classcard{position:absolute;left:4px;right:4px;border-radius:12px;padding:9px;color:#18172a;overflow:hidden;box-shadow:0 6px 16px #1b183d10;border:1px solid #fff}.classcard b{font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.classcard small{font-size:10px;opacity:.72;display:block;margin-top:3px}.empty{padding:30px;text-align:center;color:var(--muted);background:var(--card);border-radius:18px}
.list{display:grid;gap:10px}.subject{background:var(--card);border-radius:18px;padding:15px;box-shadow:var(--shadow);display:flex;align-items:center;gap:13px}.dot{width:13px;height:13px;border-radius:50%;flex:none}.subject .info{flex:1}.subject b{display:block}.subject small{color:var(--muted)}.subject button{background:#f0eff7;border-radius:10px;padding:8px 10px;color:var(--muted)}
.settings{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}label{display:block;font-size:13px;color:var(--muted);margin:13px 0 6px}input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff;outline:none}textarea{min-height:70px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.palette{display:flex;gap:9px;flex-wrap:wrap}.sw{width:32px;height:32px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px #ddd}.sw.selected{box-shadow:0 0 0 3px var(--text)}
.modal{position:fixed;inset:0;background:#11102566;backdrop-filter:blur(7px);display:none;align-items:end;justify-content:center;z-index:5}.modal.show{display:flex}.sheet{background:var(--card);width:min(650px,100%);border-radius:25px 25px 0 0;padding:20px 18px calc(20px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}.sheethead{display:flex;justify-content:space-between;align-items:center}.sheet h3{margin:0}.close{background:#f0eff7;border-radius:10px;padding:7px 10px}.actions{display:flex;gap:10px;margin-top:18px}.actions button{flex:1;padding:13px;border-radius:13px;font-weight:750}.danger{background:#fff0f0;color:#e44747}.secondary{background:#f0eff7}
@media(min-width:750px){.modal{align-items:center}.sheet{border-radius:25px}.app{padding-top:30px}.hero{padding:28px}.week .col{min-width:0}}
</style></head>
<body>
<div class="app">
<header><div class="brand"><div class="logo">🎓</div><div><h1>AulaTime</h1><small>Tu universidad, en orden.</small></div></div><button class="iconbtn" onclick="openSettings()">⚙︎</button></header>
<section class="hero"><div class="eyebrow" id="dateLabel"></div><h2 id="greeting">Buenas noches 👋</h2><p id="summary"></p><div class="next" id="nextBox"></div></section>
<div class="tabs"><button class="active" onclick="tab('horario',this)">Horario</button><button onclick="tab('asignaturas',this)">Asignaturas</button><button onclick="tab('más',this)">Más</button></div>
<section id="horario" class="panel active"><div class="sectionhead"><h3>Esta semana</h3><button class="primary" onclick="openClass()">＋ Clase</button></div><div id="week"></div></section>
<section id="asignaturas" class="panel"><div class="sectionhead"><h3>Mis asignaturas</h3><button class="primary" onclick="openSubject()">＋ Nueva</button></div><div id="subjects" class="list"></div></section>
<section id="más" class="panel"><div class="sectionhead"><h3>Personalización</h3></div><div class="settings"><label>Tema</label><select id="theme" onchange="setTheme(this.value)"><option value="system">Automático</option><option value="light">Claro</option><option value="dark">Oscuro</option></select><label>Color de acento</label><div class="palette" id="palette"></div><label>Formato del horario</label><select id="density" onchange="localStorage.density=this.value"><option value="comfortable">Cómodo</option><option value="compact">Compacto</option></select><div class="actions"><button class="secondary" onclick="exportData()">Exportar datos</button><button class="secondary" onclick="importData()">Importar</button></div></div></section>
</div>
<div id="modal" class="modal"><div class="sheet" id="sheet"></div></div>
<script>
const colors=['#6757e8','#ef5da8','#f2b84b','#31a875','#3a9ee8','#8b5cf6','#ef6b55'];
const seed={subjects:[
{id:'bd',name:'Bases de Datos',teacher:'Laura Gómez',room:'Aula A3',group:'Grupo 1',color:'#ef5da8'},
{id:'so',name:'Sistemas Operativos',teacher:'',room:'Aula A2',group:'',color:'#f2b84b'},
{id:'in',name:'Inglés',teacher:'',room:'Aula D1',group:'',color:'#3a9ee8'},
{id:'pr',name:'Programación',teacher:'',room:'B2',group:'',color:'#31a875'}],
classes:[
{id:'1',subject:'bd',day:1,start:'10:00',end:'11:30',room:'Aula A3',type:'Teoría',note:''},
{id:'2',subject:'so',day:2,start:'12:00',end:'13:30',room:'Aula A2',type:'Teoría',note:''},
{id:'3',subject:'pr',day:3,start:'09:00',end:'11:00',room:'B2',type:'Práctica',note:''},
{id:'4',subject:'bd',day:3,start:'12:00',end:'13:30',room:'Aula C3',type:'Laboratorio',note:''},
{id:'5',subject:'in',day:4,start:'15:00',end:'16:00',room:'Aula D1',type:'Seminario',note:''},
{id:'6',subject:'pr',day:1,start:'16:00',end:'18:00',room:'B2',type:'Práctica',note:''}]};
let data=JSON.parse(localStorage.aulatime||'null')||seed;let editing=null;
const dayNames=['','Lun','Mar','Mié','Jue','Vie']; const dayFull=['','Lunes','Martes','Miércoles','Jueves','Viernes'];
function save(){localStorage.aulatime=JSON.stringify(data);render()}
function render(){document.getElementById('dateLabel').textContent=new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date()); renderNext();renderWeek();renderSubjects();renderPalette();applyTheme(localStorage.theme||'system')}
function subject(id){return data.subjects.find(x=>x.id===id)}
function mins(s){let [h,m]=s.split(':').map(Number);return h*60+m}
function renderNext(){let now=new Date(), day=now.getDay(), t=now.getHours()*60+now.getMinutes();let cs=data.classes.filter(c=>c.day===day&&mins(c.end)>t&&mins(c.start)>=t).sort((a,b)=>mins(a.start)-mins(b.start));let all=data.classes.filter(c=>c.day>=1&&c.day<=5&&!(c.day===day&&mins(c.end)<=t)).sort((a,b)=>{let da=(a.day-day+7)%7,db=(b.day-day+7)%7;return da-db||mins(a.start)-mins(b.start)});let c=cs[0]||all[0];let box=document.getElementById('nextBox');if(!c){box.innerHTML='<div><strong>Semana libre</strong><span>No hay más clases programadas.</span></div><b>✓</b>';return}let s=subject(c.subject);let d=(c.day-day+7)%7;let when=d===0?'Ahora':d===1?'Mañana':dayNames[c.day]+' · '+c.start;box.innerHTML=`<div><strong>${s?.name||'Clase'} · ${c.start}–${c.end}</strong><span>📍 ${c.room||s?.room||'Sin aula'} · ${c.type||'Clase'}</span></div><b>${when}</b>`;document.getElementById('summary').textContent=`${data.classes.length} clases · ${data.subjects.length} asignaturas · todo listo para esta semana.`}
function renderWeek(){let min=8,max=19;let h='<div class="week"><div></div>'+dayNames.slice(1).map((d,i)=>`<div class="dayhead ${new Date().getDay()===i+1?'today':''}">${d}<br><small>${16+i}</small></div>`).join('');for(let hour=min;hour<max;hour++){h+=`<div class="time">${String(hour).padStart(2,'0')}:00</div>`;for(let d=1;d<=5;d++){let cls=data.classes.filter(c=>c.day===d&&mins(c.start)>=hour*60&&mins(c.start)<(hour+1)*60);h+=`<div class="col"><div class="slot"></div>`+cls.map(c=>{let s=subject(c.subject);let top=(mins(c.start)-hour*60)/64*64, height=Math.max(48,(mins(c.end)-mins(c.start))/60*64-4);return `<button class="classcard" style="top:${top}px;height:${height}px;background:${s?.color||'#ddd'}" onclick="openClass('${c.id}')"><b>${s?.name||'Sin asignatura'}</b><small>${c.start} · ${c.room||'Sin aula'}</small></button>`}).join('')+'</div>'}}document.getElementById('week').innerHTML=h+'</div>'}
function renderSubjects(){document.getElementById('subjects').innerHTML=data.subjects.length?data.subjects.map(s=>{let n=data.classes.filter(c=>c.subject===s.id).length;return `<div class="subject"><i class="dot" style="background:${s.color}"></i><div class="info"><b>${s.name}</b><small>${s.teacher||'Sin profesor'} · ${n} clases</small></div><button onclick="openSubject('${s.id}')">Editar</button></div>`}).join(''):'<div class="empty">Aún no tienes asignaturas.</div>'}
function renderPalette(){document.getElementById('palette').innerHTML=colors.map(c=>`<button class="sw ${getComputedStyle(document.documentElement).getPropertyValue('--accent').trim()===c?'selected':''}" style="background:${c}" onclick="setAccent('${c}')"></button>`).join('')}
function tab(id,btn){document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active');document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));btn.classList.add('active')}
function openClass(id){editing=id||null;let c=id?data.classes.find(x=>x.id===id):null;let s=c?subject(c.subject):data.subjects[0];document.getElementById('sheet').innerHTML=`<div class="sheethead"><h3>${c?'Editar clase':'Nueva clase'}</h3><button class="close" onclick="closeModal()">Cerrar</button></div><label>Asignatura</label><select id="fsub">${data.subjects.map(x=>`<option value="${x.id}" ${x.id===(c?.subject||s?.id)?'selected':''}>${x.name}</option>`).join('')}</select><div class="row"><div><label>Día</label><select id="fday">${dayFull.slice(1).map((x,i)=>`<option value="${i+1}" ${Number(c?.day||1)===i+1?'selected':''}>${x}</option>`).join('')}</select></div><div><label>Tipo</label><input id="ftype" value="${c?.type||'Teoría'}" placeholder="Teoría, práctica…"></div></div><div class="row"><div><label>Inicio</label><input id="fstart" type="time" value="${c?.start||'10:00'}"></div><div><label>Fin</label><input id="fend" type="time" value="${c?.end||'11:30'}"></div></div><label>Localización</label><input id="froom" value="${c?.room||s?.room||''}" placeholder="Edificio, aula…"><label>Notas</label><textarea id="fnote" placeholder="Material, enlace, recordatorio…">${c?.note||''}</textarea><div class="actions"><button class="primary" onclick="saveClass()">Guardar</button>${c?'<button class="danger" onclick="deleteClass()">Eliminar</button>':''}</div>`;document.getElementById('modal').classList.add('show')}
function saveClass(){let c={id:editing||crypto.randomUUID(),subject:fsub.value,day:+fday.value,start:fstart.value,end:fend.value,room:froom.value,type:ftype.value,note:fnote.value};if(mins(c.end)<=mins(c.start))return alert('La hora de fin debe ser posterior al inicio.');let i=data.classes.findIndex(x=>x.id===c.id);i>=0?data.classes[i]=c:data.classes.push(c);closeModal();save()}
function deleteClass(){if(confirm('¿Eliminar esta clase?')){data.classes=data.classes.filter(x=>x.id!==editing);closeModal();save()}}
function openSubject(id){editing=id||null;let s=id?subject(id):null;document.getElementById('sheet').innerHTML=`<div class="sheethead"><h3>${s?'Editar asignatura':'Nueva asignatura'}</h3><button class="close" onclick="closeModal()">Cerrar</button></div><label>Nombre</label><input id="sn" value="${s?.name||''}" placeholder="Ej. Cálculo II"><label>Profesor/a</label><input id="st" value="${s?.teacher||''}" placeholder="Nombre del profesor"><div class="row"><div><label>Grupo</label><input id="sg" value="${s?.group||''}" placeholder="A, 1, T1…"></div><div><label>Aula habitual</label><input id="sr" value="${s?.room||''}" placeholder="Aula A3"></div></div><label>Color</label><div class="palette">${colors.map(c=>`<button class="sw ${c===(s?.color||colors[0])?'selected':''}" style="background:${c}" onclick="document.querySelectorAll('#sheet .sw').forEach(x=>x.classList.remove('selected'));this.classList.add('selected');this.dataset.color='${c}'" data-color="${c}"></button>`).join('')}</div><div class="actions"><button class="primary" onclick="saveSubject()">Guardar</button>${s?'<button class="danger" onclick="deleteSubject()">Eliminar</button>':''}</div>`;document.getElementById('modal').classList.add('show')}
function saveSubject(){let chosen=document.querySelector('#sheet .sw.selected')?.dataset.color||colors[0];let s={id:editing||crypto.randomUUID(),name:sn.value.trim()||'Sin nombre',teacher:st.value,group:sg.value,room:sr.value,color:chosen};let i=data.subjects.findIndex(x=>x.id===s.id);i>=0?data.subjects[i]=s:data.subjects.push(s);closeModal();save()}
function deleteSubject(){if(confirm('Eliminar la asignatura y sus clases?')){data.subjects=data.subjects.filter(x=>x.id!==editing);data.classes=data.classes.filter(x=>x.subject!==editing);closeModal();save()}}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openSettings(){tab('más',document.querySelectorAll('.tabs button')[2])}
function setAccent(c){document.documentElement.style.setProperty('--accent',c);localStorage.accent=c;renderPalette()}
function setTheme(v){localStorage.theme=v;applyTheme(v)}
function applyTheme(v){let dark=v==='dark'||(v==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);document.documentElement.style.setProperty('--bg',dark?'#11111a':'#f7f7fb');document.documentElement.style.setProperty('--card',dark?'#1b1b27':'#fff');document.documentElement.style.setProperty('--text',dark?'#f7f7fb':'#17172a');document.documentElement.style.setProperty('--muted',dark?'#a6a6b8':'#77788c');document.documentElement.style.setProperty('--line',dark?'#30303d':'#e8e8f0');document.getElementById('theme').value=v}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='aulatime.json';a.click()}
function importData(){let i=document.createElement('input');i.type='file';i.accept='.json';i.onchange=()=>{let r=new FileReader();r.onload=()=>{try{data=JSON.parse(r.result);save()}catch(e){alert('Archivo no válido')}};r.readAsText(i.files[0])};i.click()}
document.documentElement.style.setProperty('--accent',localStorage.accent||colors[0]);render();
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
